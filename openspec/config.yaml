schema: spec-driven

context: |
  Package: @vanduo-oss/vwl-ai-chat (MIT, vanduo-oss org). Labs sibling repo —
  private / not published on npm; consume via link: beside Labs.
  Headless on-device AiChat (LiteRT Gemma / WebLLM) with FOSS guardrails and
  CSP-safe markdown. One pinned runtime dependency: obscenity 0.4.6 (reviewed local matcher); heavy runtimes load via CDN or
  host-injected loaders (CSP). Stack: TypeScript ESM library, vite lib build,
  vitest. OpenSpec is the source of truth; README is a short usage guide.
  Recommended default model: Gemma 4 E2B LiteRT (`gemma-4-E2B-it-web`, WebGPU).
  Dual QA gates: CI runs format/lint/typecheck/test:ci/build/audit (no
  WebGPU inference); local `pnpm test:local` adds Playwright Gemma E2B load+generate.
  GitHub Actions CI is allowed for the default branch.
  Hosts (e.g. Labs, ts-school) dogfood via link:/file: and must stay API-compatible.

rules:
  proposal:
    - Always include a Non-goals section
    - Call out semver / ts-school compatibility impact
  specs:
    - Use Given/When/Then scenario format
    - Use SHALL/MUST for normative requirements
  design:
    - Headless only — no Vue UI in this package
    - Keep injectable loaders for LiteRT/WebLLM
    - Only the user-approved pinned obscenity 0.4.6 runtime dependency; heavy runtimes remain injected
  tasks:
    - Include pnpm build and pnpm test when code changes
